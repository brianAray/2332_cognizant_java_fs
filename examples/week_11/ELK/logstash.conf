# Logstash Pipeline Configuration
# Parses application logs and sends them to Elasticsearch

# INPUT STAGE: Where data comes from
input {
  # TCP input for simple testing (log-generator uses this)
  tcp {
    port => 5000
    codec => line
  }
  
  # Beats input for Filebeat/Metricbeat
  beats {
    port => 5044
  }
  
  # File input for log files (alternative approach)
  # file {
  #   path => "/usr/share/logstash/sample-logs/*.log"
  #   start_position => "beginning"
  # }
}

# FILTER STAGE: Parse, transform, enrich
filter {
  # Parse the log line using grok pattern
  # Expected format: 2024-01-15T10:30:00.000Z [INFO] [order-service] Request processed in 125ms
  grok {
    match => { 
      "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] \[%{DATA:service}\] %{GREEDYDATA:log_message}"
    }
    # If pattern doesn't match, keep the original message
    tag_on_failure => ["_grokparsefailure"]
  }
  
  # Parse timestamp and set it as @timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
  
  # Extract duration if present in the message
  grok {
    match => {
      "log_message" => ".*in %{NUMBER:duration_ms:integer}ms.*"
    }
    tag_on_failure => []  # Don't tag if this optional pattern fails
  }
  
  # Add derived fields
  mutate {
    # Lowercase the log level for consistency
    lowercase => ["level"]
    
    # Add environment tag
    add_field => {
      "environment" => "demo"
    }
    
    # Remove internal fields
    remove_field => ["host", "port"]
  }
  
  # Drop events that failed to parse
  if "_grokparsefailure" in [tags] {
    drop { }
  }

  # Flag slow requests (over 200ms)
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "integer" }
    }
    if [duration_ms] > 200 {
      mutate {
        add_tag => ["slow_request"]
      }
    }
  }
  
  # Flag errors for alerting
  if [level] == "error" {
    mutate {
      add_tag => ["requires_attention"]
    }
  }
}

# OUTPUT STAGE: Where data goes
output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    # Use data streams in production:
    # data_stream => "true"
    # data_stream_type => "logs"
  }
  
  # Also output to console for debugging
  stdout {
    codec => rubydebug
  }
}
